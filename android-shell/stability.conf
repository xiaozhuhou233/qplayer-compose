// Compose compiler stability configuration.
// The core publishes its DTOs as immutable snapshots: once a list or track
// reaches the UI through a Property, the app never mutates it — a new revision
// is a new object. Telling the compiler they are stable makes every list item
// composable skippable, so the 10 Hz state pump's recomposition pass becomes a
// few cheap equality checks instead of re-executing every visible card.
dev.t1m3.qplayer.netease.dto.*
dev.t1m3.qplayer.netease.*
dev.t1m3.qplayer.lyric.*
dev.t1m3.qplayer.audio.*
dev.t1m3.qplayer.player.*
java.util.ArrayList
