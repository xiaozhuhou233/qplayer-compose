# The build host has 8 GB RAM. Keep Gradle/Kotlin's heap and native compiler
# threads below the point where the JVM can no longer reserve native memory.
org.gradle.jvmargs=-Xmx2g -Xms512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
systemProp.maven.repo.local=D:\\qplayer-dev\\cache\\maven
# Run the Kotlin compiler inside the Gradle process. The separate Kotlin compile
# daemon lived in the Gradle user home on D:; whenever that drive hiccuped the
# daemon half-died and the build aborted with an RMI/NoClassDefFoundError stack
# (CompileService$CallResult$Dying) before falling back. In-process removes that
# extra process entirely, at the cost of a little incremental-compile speed.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
